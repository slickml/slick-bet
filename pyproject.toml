[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slickbet"
version = "0.3.0"
description = "SlickML soccer betting screener: 12-factor model, backtesting, and PDF reports via Livescore API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.14"
authors = [
    { name = "Amirhessam Tahmassebi", email = "admin@slickml.com" },
]
keywords = [
    "soccer",
    "football",
    "betting",
    "screener",
    "livescore",
    "backtesting",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Games/Entertainment",
]

dependencies = [
    "requests>=2.28.0,<3.0.0",
    "reportlab>=4.0.0,<5.0.0",
]

[project.optional-dependencies]
dev = [
    "assertpy>=1.1",
    "mypy>=1.0.0",
    "poethepoet>=0.24.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "types-requests>=2.28.0",
]
docs = [
    "sphinx>=5.3",
    "sphinx-autoapi>=1.9",
    "sphinx-design>=0.3",
    "myst-parser>=0.18",
    "furo>=2022.9",
    "sphinxcontrib-mermaid>=0.9",
]

[project.scripts]
slickbet = "slickbet.cli:main"

[project.urls]
Homepage = "https://www.slickml.com"
Repository = "https://github.com/slickml/slick-bet"
Documentation = "https://www.docs.slickml.com/slick-bet/"

[tool.hatch.build.targets.wheel]
packages = ["src/slickbet"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/assets",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]
exclude = ["/.gitignore"]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    "assertpy>=1.1",
    "mypy>=1.0.0",
    "poethepoet>=0.24.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "types-requests>=2.28.0",
]
docs = [
    "sphinx>=5.3",
    "sphinx-autoapi>=1.9",
    "sphinx-design>=0.3",
    "myst-parser>=0.18",
    "furo>=2022.9",
    "sphinxcontrib-mermaid>=0.9",
]

# ============================================================================
# poethepoet - Task Runner
# ============================================================================
[tool.poe.tasks]

# Run the betting screener
[tool.poe.tasks.run]
shell = "slickbet $@"
help = "Run the betting screener for tomorrow's games"

[tool.poe.tasks.run-top]
shell = "slickbet --top ${k} $@"
args = [
    { name = "k", default = "10", options = [
        "--top",
        "-k",
    ] },
]
help = "Run screener and show top K betting opportunities"

[tool.poe.tasks.run-date]
shell = "slickbet --date ${date} $@"
args = [
    { name = "date", positional = true, required = true },
]
help = "Run screener for a specific date (YYYY-MM-DD)"

[tool.poe.tasks.run-days]
shell = "slickbet --days ${days} --top ${top} $@"
args = [
    { name = "days", default = "7", options = [
        "--days",
        "-d",
    ] },
    { name = "top", default = "20", options = [
        "--top",
        "-k",
    ] },
]
help = "Run screener for the next N days (default: 7)"

[tool.poe.tasks.run-week]
shell = "slickbet --days 7 --top 20 $@"
help = "Run screener for the next 7 days, show top 20"

[tool.poe.tasks.run-major]
shell = "slickbet --major-only --top ${top} $@"
args = [
    { name = "top", default = "10", options = [
        "--top",
        "-k",
    ] },
]
help = "Run screener for tomorrow's major league games only"

[tool.poe.tasks.run-major-week]
shell = "slickbet --days 7 --major-only --top ${top} $@"
args = [
    { name = "top", default = "20", options = [
        "--top",
        "-k",
    ] },
]
help = "Run screener for next 7 days, major leagues only"

# All leagues (Major + Persian Gulf) screener tasks
[tool.poe.tasks.run-all]
shell = "slickbet --days ${days} --all-leagues --top ${top} ${pdf:+--pdf }${pdf}"
args = [
    { name = "days", default = "3", options = [
        "--days",
        "-d",
    ] },
    { name = "top", default = "20", options = [
        "--top",
        "-k",
    ] },
    { name = "pdf", default = "", options = [
        "--pdf",
    ] },
]
help = "Run screener for ALL leagues (Major European + Persian Gulf)"

[tool.poe.tasks.run-all-week]
shell = "slickbet --days 7 --all-leagues --top ${top} $@"
args = [
    { name = "top", default = "30", options = [
        "--top",
        "-k",
    ] },
]
help = "Run screener for next 7 days, ALL leagues"

[tool.poe.tasks.run-pl]
shell = "slickbet --days ${days} --league 2 --top ${top} $@"
args = [
    { name = "days", default = "7", options = [
        "--days",
        "-d",
    ] },
    { name = "top", default = "10", options = [
        "--top",
        "-k",
    ] },
]
help = "Run screener for Premier League only"

[tool.poe.tasks.run-bundesliga]
