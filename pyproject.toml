# Backtesting tasks
[tool.poe.tasks.backtest]
shell = "slickbet backtest $@"
help = "Backtest model on Premier League (4 weeks)"

[tool.poe.tasks.backtest-bundesliga]
shell = "slickbet backtest --competition 1 --weeks ${weeks} $@"
args = [
    { name = "weeks", default = "4", options = [
        "--weeks",
        "-w",
    ] },
]
help = "Backtest on Bundesliga (Germany) for N weeks"

[tool.poe.tasks.backtest-pl]
shell = "slickbet backtest --competition 2 --weeks ${weeks} $@"
args = [
    { name = "weeks", default = "4", options = [
        "--weeks",
        "-w",
    ] },
]
help = "Backtest on Premier League (England) for N weeks"

[tool.poe.tasks.backtest-liga]
shell = "slickbet backtest --competition 3 --weeks ${weeks} $@"
args = [
    { name = "weeks", default = "4", options = [
        "--weeks",
        "-w",
    ] },
]
help = "Backtest on La Liga (Spain) for N weeks"

[tool.poe.tasks.backtest-seriea]
shell = "slickbet backtest --competition 4 --weeks ${weeks} $@"
args = [
    { name = "weeks", default = "4", options = [
        "--weeks",
        "-w",
    ] },
]
help = "Backtest on Serie A (Italy) for N weeks"

[tool.poe.tasks.backtest-ligue1]
shell = "slickbet backtest --competition 5 --weeks ${weeks} $@"
args = [
    { name = "weeks", default = "4", options = [
        "--weeks",
        "-w",
    ] },
]
help = "Backtest on Ligue 1 (France) for N weeks"

# Persian Gulf leagues backtest tasks
[tool.poe.tasks.backtest-saudi]
shell = "slickbet backtest --competition 313 --weeks ${weeks} $@"
args = [
    { name = "weeks", default = "4", options = [
        "--weeks",
        "-w",
    ] },
]
help = "Backtest on Saudi Pro League for N weeks"

[tool.poe.tasks.backtest-japan]
shell = "slickbet backtest --competition 28 --weeks ${weeks} $@"
args = [
    { name = "weeks", default = "4", options = [
        "--weeks",
        "-w",
    ] },
]
help = "Backtest on J. League (Japan) for N weeks"

[tool.poe.tasks.backtest-qatar]
shell = "slickbet backtest --competition 305 --weeks ${weeks} $@"
args = [
    { name = "weeks", default = "4", options = [
        "--weeks",
        "-w",
    ] },
]
help = "Backtest on Qatar Stars League for N weeks"

[tool.poe.tasks.backtest-uae]
shell = "slickbet backtest --competition 354 --weeks ${weeks} $@"
args = [
    { name = "weeks", default = "4", options = [
        "--weeks",
        "-w",
    ] },
]
help = "Backtest on UAE Pro League for N weeks"

[tool.poe.tasks.backtest-all]
shell = "slickbet backtest-all --weeks ${weeks} ${cache_dir:+--cache-dir }${cache_dir} ${cache_only:+--cache-only} $@"
args = [
    { name = "weeks", default = "4", options = [
        "--weeks",
        "-w",
    ] },
    { name = "cache_dir", default = "", options = [
        "--cache-dir",
    ] },
    { name = "cache_only", default = "", options = [
        "--cache-only",
    ] },
]
help = "Backtest on ALL major leagues with aggregated results. Use --cache-dir DIR and optionally --cache-only for API caching."

[tool.poe.tasks.backtest-asia]
shell = "slickbet backtest-all --asia-only --weeks ${weeks} ${cache_dir:+--cache-dir }${cache_dir} ${cache_only:+--cache-only} $@"
args = [
    { name = "weeks", default = "4", options = [
        "--weeks",
        "-w",
    ] },
    { name = "cache_dir", default = "", options = [
        "--cache-dir",
    ] },
    { name = "cache_only", default = "", options = [
        "--cache-only",
    ] },
]
help = "Backtest on ALL Asia leagues (Saudi, Australia, Japan) with aggregated results. Use --cache-dir and --cache-only for API caching."

[tool.poe.tasks.backtest-all-global]
shell = "slickbet backtest-all --include-asia --include-americas --weeks ${weeks} ${debug:+--debug} ${cache_dir:+--cache-dir }${cache_dir} ${cache_only:+--cache-only}"
args = [
    { name = "weeks", default = "4", options = [
        "--weeks",
        "-w",
    ] },
    { name = "debug", default = "", options = [
        "--debug",
    ] },
    { name = "cache_dir", default = "", options = [
        "--cache-dir",
    ] },
    { name = "cache_only", default = "", options = [
        "--cache-only",
    ] },
]
help = "Backtest on ALL leagues. Use --cache-dir DIR and --cache-only=1 for offline cached runs."

[tool.poe.tasks.tune]
shell = "slickbet tune --cache-dir ${cache_dir} --weeks ${weeks} --trials ${trials} ${strategy:+--strategy }${strategy} ${metric:+--metric }${metric}"
args = [
    { name = "cache_dir", default = "data/12_weeks_cache", options = [
        "--cache-dir",
    ] },
    { name = "weeks", default = "12", options = [
        "--weeks",
        "-w",
    ] },
    { name = "trials", default = "20", options = [
        "--trials",
    ] },
    { name = "strategy", default = "random", options = [
        "--strategy",
    ] },
    { name = "metric", default = "accuracy_excl_draws", options = [
        "--metric",
    ] },
]
help = "Hyperparameter tuning using cached data. Populate cache first: poe backtest-all-global --weeks 12 --cache-dir data/12_weeks_cache"

[tool.poe.tasks.backtest-json]
cmd = "slickbet backtest --json"
help = "Backtest with JSON output"

# Development tasks
[tool.poe.tasks.greet]
help = "Runtime user greetings"
cmd = """
echo "Welcome to slick-bet ♡♡♡ $USER ♡♡♡ ...\n\n\
███████╗██╗     ██╗ ██████╗██╗  ██╗██████╗ ███████╗████████╗
██╔════╝██║     ██║██╔════╝██║ ██╔╝██╔══██╗██╔════╝╚══██╔══╝
███████╗██║     ██║██║     █████╔╝ ██████╔╝█████╗     ██║
╚════██║██║     ██║██║     ██╔═██╗ ██╔══██╗██╔══╝     ██║
███████║███████╗██║╚██████╗██║  ██╗██████╔╝███████╗   ██║
╚══════╝╚══════╝╚═╝ ╚═════╝╚═╝  ╚═╝╚═════╝ ╚══════╝   ╚═╝\
" """

[tool.poe.tasks.clean]
help = "Remove ignored caches, coverage, and build artifacts"
cmd = """
    rm -rf .coverage
           .coverage.*
           dist/
           build/
           .mypy_cache/
           .pytest_cache/
           .ruff_cache/
           htmlcov/
           xmlcov/
           **/__pycache__/
           **/.ipynb_checkpoints/
    """

[tool.poe.tasks.lint]
cmd = "ruff check ."
help = "Run linter on source code"

[tool.poe.tasks.lint-fix]
cmd = "ruff check . --fix"
help = "Run linter and auto-fix issues"

[tool.poe.tasks.format]
cmd = "ruff format ."
help = "Format source code"

[tool.poe.tasks.mypy]
cmd = "mypy"
help = "Lint types via mypy"

[tool.poe.tasks.sphinx]
help = "Build API docs via sphinx"
cmd = "sphinx-build -b html docs/ docs/_build"

[tool.poe.tasks.test]
help = "Run unit-tests via pytest with 100% coverage gate"
cmd = """
    python -m pytest
        --cov=slickbet
        --cov-report=term-missing
        --cov-report=html
        --cov-report=xml
        --cov-config=.coveragerc
        --tb=short
        -ra
        -v
    """

[tool.poe.tasks.check]
help = "Check all linting steps"
sequence = [
    "greet",
    { cmd = "poe format --check" },
    { cmd = "ruff check ." },
    { cmd = "poe mypy" },
]

[tool.poe.tasks.fix]
sequence = ["lint-fix", "format"]
help = "Fix linting issues and format code"

[tool.poe.tasks.build]
help = "Build sdist and wheel via uv"
cmd = "uv build"

[tool.poe.tasks.dev]
sequence = ["fix", "test"]
help = "Fix code and run tests"
